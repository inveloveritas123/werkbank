# WERKBANK settings.example.yaml — NUR nicht-geheime Konfiguration.
# Echte Werte lokal/auf separatem Branch. Secrets NIEMALS hier — nur Env-Referenzen.
routing:
  primary_endpoint: eu-region-endpoint     # z. B. EU-Region eines Anbieters
  other_tiers_router: <eu-router-url>       # EU-Router der uebrigen Tiers
  llm_proxy_url: http://localhost:8080
  primary_key_env: PRIMARY_API_KEY          # NUR der Variablenname, nie der Key
tiers: { haiku_pct: 80, sonnet_pct: 15, opus_pct: 5, confirm_gate_from: S5 }
budget: { period_cap_eur: 0, kill_switch_eur: 0 }
conventions: { changelog: CHANGELOG.md, index_first: true }
modules: { core: true, gates: true, kanzler: false, brownfield: false, branch_modules: [] }
kanzler:
  enabled: false
build_isolation: { large: vm, small: container, default: vm }
default_mode: greenfield
