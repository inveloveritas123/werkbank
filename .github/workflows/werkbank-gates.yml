# WERKBANK Self-CI — "hartes Gruen" real gemacht.
#
# Die Dev-Tools werden installiert und MUESSEN durchlaufen (ruff, mypy, bandit, Tests),
# danach der harte Gate-Lauf gegen das Profil `werkbank_self`. Geht nur GRUEN, wenn
# jedes Pflicht-Gate aktiv besteht — ein SKIP (Tool fehlt / kein Check / kein Kontext)
# zaehlt als UNGEDECKT und faerbt ROT. Auf push (main) heilt der Feedback-Schritt
# rote Gates in Issues; der Report wird als Artefakt hochgeladen.
name: werkbank-gates

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Dev-Tools installieren
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Typen (mypy)
        run: mypy gates

      - name: SAST (bandit)
        # Policy wie Gate D1: nur High/Medium blocken (Low subprocess-Warnungen sind beratend),
        # und die Test-Fixtures ausschliessen (enthalten absichtlich "unsichere" Muster, z. B.
        # geplante SQLi/Secrets fuer den Haerte-Test).
        run: bandit -r gates -q --severity-level medium -x gates/checks/tests

      - name: Tests (unittest)
        run: python3 -m unittest discover -s gates/checks/tests -p "test_*.py"

      - name: WERKBANK Gate-Lauf — hartes Gruen (Profil werkbank_self)
        id: gate
        run: python3 gates/runner.py --target . --report GATE-REPORT.md --profile werkbank_self --ci

      - name: Gate-Report als Artefakt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-report
          path: GATE-REPORT.md
          if-no-files-found: ignore

      - name: Selbstheilung — rote Gates -> Issues, gruene -> schliessen
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f feedback/feedback.py ]; then
            python3 feedback/feedback.py --report GATE-REPORT.md --backlog /tmp/backlog.md \
              --apply --gh-issues --close-resolved || echo "::warning::feedback-Schritt uebersprungen"
          fi
