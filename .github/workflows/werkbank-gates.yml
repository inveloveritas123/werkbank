# WERKBANK Self-CI — "hartes Gruen" real gemacht.
#
# Die Dev-Tools werden installiert und MUESSEN durchlaufen (ruff, mypy, bandit, Tests),
# danach der harte Gate-Lauf gegen das Profil `werkbank_self`. Geht nur GRUEN, wenn
# jedes Pflicht-Gate aktiv besteht — ein SKIP (Tool fehlt / kein Check / kein Kontext)
# zaehlt als UNGEDECKT und faerbt ROT. Auf push (main) heilt der Feedback-Schritt
# rote Gates in Issues; der Report wird als Artefakt hochgeladen.
name: werkbank-gates

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      # Go (optional): nur wenn das Projekt ein go.mod hat (Root oder Unterordner, ohne
      # vendor/node_modules/testdata). Ohne go.mod laufen diese Schritte nicht — der Python-Pfad
      # bleibt unveraendert. Die Gates B1-B3/C1/C2/D1/D2/H2 erkennen Go selbst (gates/checks/golang.py).
      - name: Go-Modul erkennen
        id: gomod
        run: |
          f=$(find . \( -name vendor -o -name node_modules -o -name .git -o -name testdata \) -prune \
                -o -name go.mod -print | sort | head -n 1)
          echo "file=${f}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        if: steps.gomod.outputs.file != ''
        with:
          go-version-file: ${{ steps.gomod.outputs.file }}

      - name: Go-Gate-Werkzeuge installieren (gosec, govulncheck, gocyclo)
        if: steps.gomod.outputs.file != ''
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # SINGLE SOURCE OF TRUTH: die CI ruft NUR die Makefile-Targets. Damit laufen lokal
      # (`make all`) und CI per Konstruktion dieselben Befehle — sie koennen nicht mehr
      # auseinanderdriften (genau der Bug, der die CI 14 Laeufe lang unbemerkt rot hielt).
      - name: Dev-Tools installieren
        run: make dev-setup

      - name: Lint (ruff)
        run: make lint

      - name: Typen (mypy)
        run: make type

      - name: SAST (bandit)
        run: make sast

      - name: Tests (unittest)
        run: make test

      - name: WERKBANK Gate-Lauf — hartes Gruen (Profil werkbank_self)
        id: gate
        run: make gate

      - name: Gate-Report als Artefakt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-report
          path: GATE-REPORT.md
          if-no-files-found: ignore

      - name: Selbstheilung — rote Gates -> Issues, gruene -> schliessen
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f feedback/feedback.py ]; then
            python3 feedback/feedback.py --report GATE-REPORT.md --backlog /tmp/backlog.md \
              --apply --gh-issues --close-resolved || echo "::warning::feedback-Schritt uebersprungen"
          fi
